[package]
name = "coupcat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "CoupCat's desktop app: a Dioxus shell over the Concat engine (M1)."

[[bin]]
name = "coupcat"
path = "src/main.rs"

# The screen recorder ties ffmpeg to the app's lifetime with a Windows job;
# playback asks for a fine timer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[build-dependencies]
# Embed the app icon into the exe (shown in Explorer / the taskbar).
winresource = "0.1"

[dependencies]
# UI: native desktop (webview) renderer. CoupCat's PC + Web target.
dioxus = { version = "0.6", features = ["desktop"] }
# Native file-open dialog for importing clips.
rfd = "0.15"
# Preview/playback frames are shown as embedded JPEG data URLs (M1 path; the
# wgpu compositor comes in at M2/M3).
base64 = "0.22"
# Decode the embedded app icon PNG for the window icon.
png = "0.17"
# The UI polls the playback thread's shared snapshot on a timer.
tokio = { version = "1", features = ["time"] }
# Preview playback, and the screen recorder's capture of the computer's sound.
cpal = "0.16"
# The engine.
concat-core.workspace = true
concat-media.workspace = true
concat-project.workspace = true
concat-export.workspace = true
# What the engine's playback module needs (it is compiled into this crate; see
# main.rs): disk-backed samples, the cached sound's settings and its log lines.
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
log = "0.4"
concat-effects.workspace = true
concat-text.workspace = true
# Project files: the engine's document is JSON.
serde_json.workspace = true
# Background removal (person cutout): on-device inference via ONNX Runtime,
# loaded dynamically at runtime (see workspace ort = load-dynamic).
concat-vision = { workspace = true, features = ["infer"] }
# Auto-captions: whisper.cpp in-process (built from source by CMake; needs the
# MSVC toolchain). Used directly rather than via concat-speech to avoid its
# concat-host + sherpa-onnx dependencies.
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"
